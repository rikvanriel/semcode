# The checks the git hooks run, run again where they cannot be skipped.
#
# hooks/pre-commit and hooks/pre-push only protect a clone that has been told
# to use them (`git config core.hooksPath hooks`), and neither runs for a pull
# request opened from a fork or by a bot.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless; main is left
# alone so every merged commit keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    # A cold build of the arrow and lance dependencies is long; this is a
    # ceiling on a stuck run, not a target.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # protoc, and the .proto files it reads: lance-encoding imports
      # google/protobuf/empty.proto, one of protobuf's well-known types, which
      # ships in libprotobuf-dev and not alongside the compiler. Installing
      # protobuf-compiler alone gets a protoc that runs and then fails with
      # "google/protobuf/empty.proto: File not found".
      # openssl and curl: gix reaches the network through curl built against
      # openssl, and both -sys crates want headers and pkg-config to find them.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            pkg-config libssl-dev libcurl4-openssl-dev

      - name: Show what the build will use
        run: |
          protoc --version
          ls /usr/include/google/protobuf/empty.proto

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache (registry + incremental build)
        uses: Swatinem/rust-cache@v2
        # Like sashiko: saves registry + target incrementally; keyed on
        # Cargo.lock internally, but shares save/restore keys across OS.

      - name: sccache (compiler cache across Cargo.lock bumps)
        uses: mozilla-actions/sccache-action@v0.0.11

      # First, because it needs no build and a formatting failure should not
      # cost twenty minutes to report.
      - name: cargo fmt
        run: cargo fmt --check

      # Stands in for `cargo check --all-targets` from pre-commit, which it
      # subsumes: clippy fails on the compile errors check would report, and
      # on the lints pre-push asks for.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Includes the doctests, which are compiled and run, and which have
      # broken on their own before now.
      - name: cargo test
        run: cargo test

      - name: sccache stats
        run: sccache --show-stats
        if: always()
